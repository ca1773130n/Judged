[package]
name = "judged-cli"
description = "Command-line entry point for Judged."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "judged"
path = "src/main.rs"

[dependencies]
judged-core = { workspace = true }
judged-ratchet = { workspace = true }
judged-mutants = { workspace = true }

# The CLI is the process boundary, so it is where SARIF logs stop being bytes on
# disk and become `judged_core::sarif` types, and where the `--json` report stops
# being types and becomes bytes again. `judged-core` models the SARIF subset but
# ships no reader, so the reader lives here.
serde_json = { workspace = true }
